name: Macrobenchmark

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Benchmark target description or device pool'
        required: false
        default: 'local-runner'

jobs:
  benchmark:
    name: Build & Prepare Macrobenchmark Target
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Benchmark APK Target
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Summary & Next Steps
        run: |
          echo "Macrobenchmark build target successfully compiled."
          echo "For physical device runs or Firebase Test Lab execution, connect runner or invoke gcloud firebase test android run."
